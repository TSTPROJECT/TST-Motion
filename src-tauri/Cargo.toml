[package]
name = "tst-motion"
version = "0.6.7"
description = "TST Motion: free 2D motion animation"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tst_motion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-opener = "2"

[profile.release]
# Small, fast program for low-end laptops
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Timelapse: copy the program's own window (Windows only)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }
