<title>TST Motion ต้นแบบ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Floating-panel editor: layers card | dotted canvas with a tool dock | properties card, timeline card below. Phone: canvas on top, tabbed sheet below. */
:root {
  --bg: #eceef3; --surface: #ffffff; --surface-2: #f3f4f8; --canvas: #e2e5ec; --dot: #c6cbd6;
  --line: #e0e3ea; --line-2: #cdd2dc; --fg: #151821; --muted: #697186;
  --accent: #3b74ff; --accent-soft: rgba(59,116,255,.12); --on-accent: #ffffff;
  --key: #f2a51a; --key-line: #8a5a00; --bone: #ff5f9e; --ok: #13a067; --scrim: rgba(16,19,30,.42);
  --shadow: 0 1px 2px rgba(20,24,40,.05), 0 6px 20px rgba(20,24,40,.06);
  --shadow-lg: 0 20px 60px rgba(20,24,40,.22);
  --font-ui: "Anuphan", "Leelawadee UI", "Tahoma", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "Consolas", monospace;
  --r: 16px; --lw: 128px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c0e13; --surface: #161920; --surface-2: #1e222b; --canvas: #101218; --dot: #252a35;
  --line: #242833; --line-2: #333947; --fg: #eceef4; --muted: #8b93a6;
  --accent: #5b8cff; --accent-soft: rgba(91,140,255,.16); --on-accent: #ffffff;
  --key: #f6b53a; --key-line: #4a3000; --bone: #ff77ae; --ok: #45d091; --scrim: rgba(0,0,0,.6);
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 26px rgba(0,0,0,.25); --shadow-lg: 0 24px 70px rgba(0,0,0,.55);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c0e13; --surface: #161920; --surface-2: #1e222b; --canvas: #101218; --dot: #252a35;
  --line: #242833; --line-2: #333947; --fg: #eceef4; --muted: #8b93a6;
  --accent: #5b8cff; --accent-soft: rgba(91,140,255,.16); --on-accent: #ffffff;
  --key: #f6b53a; --key-line: #4a3000; --bone: #ff77ae; --ok: #45d091; --scrim: rgba(0,0,0,.6);
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 26px rgba(0,0,0,.25); --shadow-lg: 0 24px 70px rgba(0,0,0,.55);
  color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; padding-block: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

.top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.mark { width: 32px; height: 32px; border-radius: 10px; background: var(--fg); display: grid; place-items: center; flex: none; }
.mark svg { width: 20px; height: 20px; }
.proj { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.proj b { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj small { color: var(--muted); font-size: 11.5px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.proj small::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.ibtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.ibtn:hover { border-color: var(--line-2); }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--line-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { border: 0; background: none; height: 28px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.work { display: grid; grid-template-columns: 236px minmax(0, 1fr) 268px; gap: 10px; min-height: 0; }
.pane { min-height: 0; display: flex; flex-direction: column; }
.pane-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 14px 8px; }
.pane-h h2 { margin: 0; font-size: 13px; font-weight: 600; }
.pane-h span { font-size: 11.5px; color: var(--muted); }
.scroll { overflow-y: auto; min-height: 0; }

.layers { padding: 0 8px 10px; display: flex; flex-direction: column; gap: 1px; }
.lyr { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 6px 0 calc(6px + var(--d) * 16px); border-radius: 10px; cursor: pointer; font-size: 13px; }
.lyr:hover { background: var(--surface-2); }
.lyr.sel { background: var(--accent-soft); color: var(--accent); }
.lyr .th { width: 28px; height: 28px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.lyr .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lyr .tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; }
.lyr .eye { border: 0; background: none; width: 26px; height: 26px; border-radius: 6px; color: var(--muted); display: grid; place-items: center; }
.lyr .eye:hover { background: var(--surface); }
.lyr.off .nm, .lyr.off .th { opacity: .4; }

.stage { position: relative; min-height: 0; border-radius: var(--r); background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 18px 18px; border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
.stage-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; pointer-events: none; z-index: 2; }
.stage-top > * { pointer-events: auto; }
.hint { max-width: 40ch; font-size: 12px; line-height: 1.5; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; box-shadow: var(--shadow); }
#stage { flex: 1; width: 100%; min-height: 0; padding: 58px 16px 76px; touch-action: none; user-select: none; display: block; }
#stage .part { cursor: grab; }
#stage .part.sel .shape { stroke: var(--accent); }
#frame-line { fill: none; stroke: var(--line-2); stroke-width: 1; }
.dock { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); z-index: 2; max-width: calc(100% - 24px); }
.tool { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border: 0; background: none; border-radius: 10px; color: var(--muted); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.tool:hover { color: var(--fg); background: var(--surface-2); }
.tool[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
.dock .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.bgsw { width: 26px; height: 26px; border-radius: 8px; border: 2px solid transparent; padding: 0; box-shadow: inset 0 0 0 1px var(--line-2); }
.bgsw[aria-pressed="true"] { border-color: var(--accent); }
.bgsw.alpha { background: repeating-conic-gradient(#d4d7df 0 25%, #f6f7f9 0 50%) 0 0 / 10px 10px; }

.props { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 14px; }
.who { display: flex; flex-direction: column; gap: 2px; }
.who b { font-size: 18px; font-weight: 600; }
.who span { font-size: 12px; color: var(--muted); }
.knav { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.knav .ibtn { width: 32px; height: 32px; border-radius: 8px; }
.kdia { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; font-weight: 500; }
.kdia i { width: 10px; height: 10px; transform: rotate(45deg); border: 1.6px solid var(--key); border-radius: 2px; }
.kdia.on i { background: var(--key); }
.grp { display: flex; flex-direction: column; gap: 10px; }
.grp h3 { margin: 0; font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.f { display: grid; grid-template-columns: 72px minmax(0, 1fr) 52px; gap: 10px; align-items: center; }
.f label { font-size: 12.5px; color: var(--muted); }
.f output { font-family: var(--font-num); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; background: var(--surface-2); border-radius: 6px; padding: 3px 6px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 99px; background: var(--line-2); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 99px; background: var(--line-2); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.eases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.ease { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 11.5px; color: var(--muted); }
.ease svg { width: 34px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.ease[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.tl { display: flex; flex-direction: column; min-height: 0; }
.tl-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tl-h .ibtn { width: 32px; height: 32px; border-radius: 8px; }
.play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--fg); color: var(--surface); display: grid; place-items: center; }
.play svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
.tc { font-family: var(--font-num); font-size: 13px; font-variant-numeric: tabular-nums; padding: 0 6px; }
.tc span { color: var(--muted); }
.tl-meta { margin-left: auto; font-size: 12px; color: var(--muted); }
.tl-scroll { max-height: 196px; overflow: auto; }
.tl-inner { position: relative; touch-action: none; min-width: 520px; }
.row { display: grid; grid-template-columns: var(--lw) minmax(0, 1fr); height: 26px; }
.row .lab { position: sticky; left: 0; z-index: 1; font-size: 12px; padding: 0 10px 0 calc(10px + var(--d) * 10px); display: flex; align-items: center; gap: 6px; background: var(--surface); border-right: 1px solid var(--line); color: var(--muted); white-space: nowrap; overflow: hidden; cursor: pointer; }
.row .lab::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); flex: none; }
.row.sel .lab { color: var(--fg); font-weight: 500; }
.row.sel .lab::before { background: var(--accent); }
.row.sel .trk { background: var(--accent-soft); }
.trk { position: relative; border-bottom: 1px solid var(--line); }
.trk::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--line); }
.ruler { position: sticky; top: 0; z-index: 3; height: 24px; }
.ruler .lab { cursor: default; z-index: 4; }
.ruler .lab::before { display: none; }
.ruler .trk { background: var(--surface); font-family: var(--font-num); font-size: 10px; color: var(--muted); }
.ruler .trk::before { display: none; }
.tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); padding-left: 4px; line-height: 24px; }
.kf { position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; transform: rotate(45deg); background: var(--key); border: 1.5px solid var(--key-line); padding: 0; border-radius: 2.5px; z-index: 1; }
.kf.now { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--fg); }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); left: calc(var(--lw) + (100% - var(--lw)) * var(--frac, 0)); pointer-events: none; z-index: 5; }
.playhead::before { content: ""; position: absolute; top: 2px; left: -6px; width: 14px; height: 14px; border-radius: 4px 4px 7px 7px; background: var(--accent); }

.tabs { display: none; }

.overlay { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 30; }
.dlg { width: min(900px, 100%); max-height: calc(100% - 8px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.dlg-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 22px 6px; }
.dlg-h h3 { margin: 0; font-size: 20px; font-weight: 600; }
.dlg-h p { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
.dlg-b { padding: 14px 22px; display: flex; flex-direction: column; gap: 16px; }
.dlg-f { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding: 14px 22px 20px; border-top: 1px solid var(--line); }
.dlg-f .grow { margin-right: auto; font-size: 12.5px; color: var(--muted); }
.lbl { font-size: 12.5px; font-weight: 600; margin-bottom: 8px; display: block; }

.cut { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; }
.cut-left { display: flex; flex-direction: column; gap: 10px; }
.drop { display: flex; align-items: center; gap: 12px; border: 1.5px dashed var(--line-2); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
.drop:hover { border-color: var(--accent); }
.drop .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.drop b { display: block; font-size: 13px; font-weight: 500; }
.drop small { color: var(--muted); font-family: var(--font-num); font-size: 10.5px; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.thumbs img { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.prev { position: relative; border-radius: 14px; border: 1px solid var(--line); background: repeating-conic-gradient(var(--surface-2) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; aspect-ratio: 1 / 1.05; max-width: 100%; overflow: hidden; }
.prev svg { width: 100%; height: 100%; display: block; }
.prev .pc { transition: transform .6s cubic-bezier(.3,1.35,.5,1), opacity .2s; }
.prev.done .pc .shape { stroke: var(--gc); stroke-width: 3.5; }
.prev.dim .pc:not(.hl) { opacity: .18; }
.scan { position: absolute; left: 0; right: 0; height: 40%; top: -40%; background: linear-gradient(to bottom, transparent, var(--accent-soft) 70%, var(--accent) 71%, transparent 72%); pointer-events: none; }
.prev.busy .scan { animation: scan .9s ease-in-out; }
@keyframes scan { to { top: 100%; } }
.cut-right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lvl { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.lvl b { font-size: 13.5px; font-weight: 600; }
.lvl span { font-size: 11.5px; color: var(--muted); }
.lvl[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.lvl[aria-pressed="true"] b { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; font-weight: 500; color: var(--muted); }
.chip svg { width: 14px; height: 14px; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 7px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--surface); font-size: 11.5px; text-align: center; cursor: default; }
.tile svg { width: 100%; height: 52px; border-radius: 8px; background: var(--surface-2); }
.tile b { font-weight: 500; line-height: 1.25; }
.tile small { color: var(--muted); font-size: 10.5px; }
.tile:hover { border-color: var(--gc); }
.tile .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gc); display: inline-block; margin-right: 4px; }
.empty { border: 1px dashed var(--line-2); border-radius: 12px; padding: 22px 14px; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.6; }
.count { font-size: 12.5px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.trust { display: flex; gap: 10px; align-items: flex-start; font-size: 12px; line-height: 1.6; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.trust svg { color: var(--ok); margin-top: 1px; }
.trust b { color: var(--fg); font-weight: 600; }

.fmts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fmt { position: relative; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
.fmt .pv { width: 52px; height: 52px; border-radius: 10px; flex: none; display: grid; place-items: center; font-family: var(--font-num); font-size: 11px; font-weight: 500; color: #fff; }
.fmt .pv.alpha { background: repeating-conic-gradient(#cfd3dc 0 25%, #f3f4f7 0 50%) 0 0 / 12px 12px; color: #2b2f3a; }
.fmt b { display: block; font-size: 14.5px; font-weight: 600; margin-bottom: 2px; }
.fmt span { font-size: 12px; color: var(--muted); line-height: 1.5; }
.fmt .ck { position: absolute; top: 12px; right: 12px; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-2); display: grid; place-items: center; }
.fmt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.fmt[aria-pressed="true"] .ck { background: var(--accent); border-color: var(--accent); }
.fmt[aria-pressed="true"] .ck::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--on-accent); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.opt { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
.opt select { height: 36px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; color: var(--fg); }
.swatches { display: flex; gap: 6px; height: 36px; align-items: center; }
.sw { width: 28px; height: 28px; border-radius: 8px; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.sw[aria-pressed="true"] { border-color: var(--accent); }
.queue { display: flex; flex-direction: column; gap: 10px; }
.q { display: grid; grid-template-columns: 64px minmax(0, 1fr) 110px; gap: 12px; align-items: center; font-size: 13px; }
.q b { font-weight: 600; }
.q .bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.q .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; }
.q .st { font-size: 12px; color: var(--muted); text-align: right; }
.q.done .bar i { background: var(--ok); }
.q.done .st { color: var(--ok); }

function sample(id, tt) {

function buildTimeline() {

  for (let s = 0; s <= DUR * 2; s++) { const tt = s / 2; r += `<span class="tick" style="left:${tt / DUR * 100}%">${tt % 1 ? "" : tt + "s"}</span>`; }
  $("ruler").innerHTML = r;
  $("rows").innerHTML = TREE.map(id => `<div class="row${id === sel ? " sel" : ""}" data-row="${id}"><div class="lab" style="--d:${depth(id)}">${t(id)}</div><div class="trk">${keys[id].map((k, i) => `<button type="button" class="kf${Math.abs(k.t - time) < 1e-3 ? " now" : ""}" data-kid="${id}" data-ki="${i}" style="left:${k.t / DUR * 100}%" aria-label="${t(id)} ${k.t.toFixed(2)}s"></button>`).join("")}</div></div>`).join("");
  $("tl-meta").textContent = t("tl_meta")(IDS.length);
}
const keyAt = id => keys[id].findIndex(k => Math.abs(k.t - time) < 1e-3);
function refreshProps() {
  $("part-name").textContent = t(sel);
  const par = PARTS[sel].parent; $("part-parent").textContent = par ? t("under")(t(par)) : t("top");
  const v = sample(sel, time);
  PROPS.forEach(p => { $("f-" + p).value = v[p]; $("o-" + p).textContent = p === "s" || p === "o" ? Math.round(v[p] * 100) + "%" : p === "rot" ? Math.round(v[p]) + "°" : Math.round(v[p]); });
  const ki = keyAt(sel), kt = $("k-toggle");
  kt.classList.toggle("on", ki >= 0); kt.querySelector("span").textContent = t(ki >= 0 ? "key_on" : "key_off");
  const en = ki >= 0 ? keys[sel][ki].ease : "smooth";
  document.querySelectorAll(".ease").forEach(b => b.setAttribute("aria-pressed", b.dataset.ease === en));
  $("k-prev").disabled = !keys[sel].some(k => k.t < time - 1e-3);
  $("k-next").disabled = !keys[sel].some(k => k.t > time + 1e-3);
  document.querySelectorAll("#stage .part").forEach(g => g.classList.toggle("sel", g.dataset.part === sel));
}
function refreshTime() {
  const f = Math.round(time * FPS), ss = Math.floor(time + 1e-6), ff = f - ss * FPS;
  $("tc").innerHTML = `00:0${ss}:${String(ff).padStart(2, "0")} <span>/ 00:03:00</span>`;
  $("frame-no").textContent = t("frame")(f);
  $("tl-inner").style.setProperty("--frac", time / DUR);
}
function render(full) {
  applyPose(); refreshTime(); refreshProps();
  if (full) { buildTimeline(); buildLayers(); }
  else document.querySelectorAll(".kf").forEach(k => k.classList.toggle("now", Math.abs(keys[k.dataset.kid][+k.dataset.ki].t - time) < 1e-3));
}

function setKey(id, patch) {
  pause();
  time = Math.round(time * FPS) / FPS;
  let ki = keyAt(id);
  if (ki < 0) { const v = sample(id, time), nk = Object.assign({ t: time, ease: "smooth" }, ...PROPS.map(p => ({ [p]: v[p] }))); keys[id].push(nk); keys[id].sort((a, b) => a.t - b.t); ki = keys[id].indexOf(nk); }
  Object.assign(keys[id][ki], patch);
  render(true);
}

let raf = 0, last = 0;
function loop(ts) { if (!playing) return; if (last) time = (time + (ts - last) / 1000) % DUR; last = ts; render(false); raf = requestAnimationFrame(loop); }
function play() { playing = true; last = 0; $("play-ico").innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'; $("play").setAttribute("aria-label", "Pause"); raf = requestAnimationFrame(loop); }
function pause() { if (!playing) return; playing = false; cancelAnimationFrame(raf); $("play-ico").innerHTML = '<path d="M7 4.5v15l13-7.5z"/>'; $("play").setAttribute("aria-label", "Play"); render(true); }
$("play").onclick = () => playing ? pause() : play();
const stepTo = tt => { pause(); time = Math.min(DUR, Math.max(0, Math.round(tt * FPS) / FPS)); render(true); };
$("f-prev").onclick = () => stepTo(time - 1 / FPS);
$("f-next").onclick = () => stepTo(time + 1 / FPS);
$("k-prev").onclick = () => { const k = keys[sel].filter(k => k.t < time - 1e-3).pop(); if (k) stepTo(k.t); };
$("k-next").onclick = () => { const k = keys[sel].find(k => k.t > time + 1e-3); if (k) stepTo(k.t); };
$("k-toggle").onclick = () => { const ki = keyAt(sel); if (ki >= 0) { if (keys[sel].length > 1) { keys[sel].splice(ki, 1); render(true); } } else setKey(sel, {}); };

const inner = $("tl-inner");
function scrub(e) {
  const r = inner.getBoundingClientRect(), lw = parseFloat(getComputedStyle(inner).getPropertyValue("--lw"));
  const fr = Math.min(1, Math.max(0, (e.clientX - r.left - lw) / (r.width - lw)));
  time = Math.round(fr * DUR * FPS) / FPS; render(false);
}
inner.addEventListener("pointerdown", e => {
  const kf = e.target.closest(".kf"), lab = e.target.closest(".lab"), row = e.target.closest(".row");
  if (kf) { pause(); sel = kf.dataset.kid; time = keys[sel][+kf.dataset.ki].t; render(true); return; }
  if (lab) { if (row && row.dataset.row) { sel = row.dataset.row; render(true); } return; }
  pause(); inner.setPointerCapture(e.pointerId); scrub(e);
  const mv = ev => scrub(ev), up = () => { inner.removeEventListener("pointermove", mv); inner.removeEventListener("pointerup", up); render(true); };
  inner.addEventListener("pointermove", mv); inner.addEventListener("pointerup", up);
});

const svgPoint = e => new DOMPoint(e.clientX, e.clientY).matrixTransform(world.getScreenCTM().inverse());
svg.addEventListener("pointerdown", e => {
  const g = e.target.closest(".part"); if (!g) return;
  e.preventDefault(); sel = g.dataset.part; render(true);
  const piv = wp(sel, ...PARTS[sel].pivot), p0 = svgPoint(e), a0 = Math.atan2(p0.y - piv.y, p0.x - piv.x), r0 = sample(sel, time).rot;
  svg.setPointerCapture(e.pointerId);
  const mv = ev => { const p = svgPoint(ev), d = (Math.atan2(p.y - piv.y, p.x - piv.x) - a0) * 180 / Math.PI; let r = r0 + d; while (r > 180) r -= 360; while (r < -180) r += 360; setKey(sel, { rot: Math.round(r) }); };
  const up = () => { svg.removeEventListener("pointermove", mv); svg.removeEventListener("pointerup", up); };
  svg.addEventListener("pointermove", mv); svg.addEventListener("pointerup", up);
});

PROPS.forEach(p => $("f-" + p).addEventListener("input", e => setKey(sel, { [p]: parseFloat(e.target.value) })));
document.querySelectorAll(".ease").forEach(b => b.onclick = () => setKey(sel, { ease: b.dataset.ease }));
document.querySelectorAll(".tool").forEach(b => b.onclick = () => {
  if (b.dataset.tool === "cut") { openDlg("dlg-cut"); return; }
  tool = b.dataset.tool;
  document.querySelectorAll(".tool").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("hint").textContent = t("h_" + tool); drawOverlay();
});
document.querySelectorAll("#aspect button").forEach(b => b.onclick = () => { setAspect(b.dataset.asp); drawOverlay(); });
document.querySelectorAll(".bgsw").forEach(b => b.onclick = () => setBg(b.dataset.bg));
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { $("app").dataset.tab = b.dataset.tab; document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-pressed", x === b)); });

let lastFocus = null;
function openDlg(id) { pause(); lastFocus = document.activeElement; $(id).hidden = false; const f = $(id).querySelector(".btn.primary:not(:disabled), .btn"); if (f) f.focus(); }
function closeDlg(o) { o.hidden = true; if (lastFocus) lastFocus.focus(); }
document.querySelectorAll(".overlay").forEach(o => o.addEventListener("click", e => { if (e.target === o || e.target.closest("[data-close]")) closeDlg(o); }));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.querySelectorAll(".overlay:not([hidden])").forEach(closeDlg);
  if (e.key === " " && !e.target.closest("button, input, select") && document.querySelectorAll(".overlay:not([hidden])").length === 0) { e.preventDefault(); playing ? pause() : play(); }
});
$("open-export").onclick = () => { $("queue").hidden = true; openDlg("dlg-export"); };
$("open-import").onclick = () => openDlg("dlg-cut");
let toastT = 0;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

const GC = ["#3b74ff", "#f2a51a", "#13a07a", "#e2437a", "#8a5cf6", "#0ea5c6", "#e86a2c", "#5b9e1f", "#c43bd1", "#d4a20a", "#2f7d8f", "#ef5a5a", "#6672e8", "#9b6b3c", "#1f9e5a"];
$("cut-prev").innerHTML = DRAW.map(id => `<g class="pc" data-pc="${id}">${shapes(id)}</g>`).join("");
let cutLv = 3, cutDone = false; const cutCats = new Set(["hair", "face", "clothes", "items", "hands"]);
const kept = id => PARTS[id].lv <= cutLv && (PARTS[id].cat === "body" || cutCats.has(PARTS[id].cat));
const groupOf = id => kept(id) ? id : groupOf(PARTS[id].merge);
function cutGroups() { const g = {}; TREE.forEach(id => { const r = groupOf(id); (g[r] = g[r] || []).push(id); }); return g; }
const CENTER = { body: [0, -45], legL: [-20, 40], legR: [20, 40], head: [0, -150], hairBack: [0, -190], ponytail: [84, -160], hairFront: [0, -196], eyes: [0, -142], mouth: [0, -114], scarf: [22, -70], armL: [-44, -58], handL: [-44, -20], armR: [44, -58], handR: [44, -20], wand: [70, -54] };
const BOOST = { eyes: [0, 0], mouth: [0, 6], hairFront: [0, -10], hairBack: [-18, -6], ponytail: [16, 0], wand: [14, -6], handL: [-6, 8], handR: [10, 8], scarf: [10, 4] };
function drawCut() {
  const groups = cutGroups(), roots = Object.keys(groups), prev = $("prev");
  prev.classList.toggle("done", cutDone);
  document.querySelectorAll("#cut-prev .pc").forEach(g => {
    const id = g.dataset.pc, r = groupOf(id), c = CENTER[r], b = BOOST[r] || [0, 0];
    const dx = cutDone ? (c[0] - 0) * .16 + b[0] : 0, dy = cutDone ? (c[1] + 70) * .14 + b[1] : 0;
    g.style.transform = `translate(${dx}px, ${dy}px)`;
    g.style.setProperty("--gc", GC[roots.indexOf(r) % GC.length]);
  });
  $("res-count").textContent = cutDone ? t("pieces")(roots.length) : "";
  $("tiles").className = cutDone ? "tiles" : "";
  $("tiles").innerHTML = cutDone ? roots.map((r, i) => `<div class="tile" data-g="${r}" style="--gc:${GC[i % GC.length]}">${thumbSvg(groups[r], 8)}<b><i class="dot"></i>${t(r)}</b><small>${groups[r].length > 1 ? t("merged")(groups[r].length) : "&nbsp;"}</small></div>`).join("") : `<div class="empty">${t("empty")}</div>`;
  $("use-cut").disabled = !cutDone;
  $("run-cut").querySelector("span").textContent = t(cutDone ? "re_cut" : "run_cut");
}
$("tiles").addEventListener("pointerover", e => { const tl = e.target.closest(".tile"); const prev = $("prev"); if (!tl) return; const gs = cutGroups()[tl.dataset.g]; prev.classList.add("dim"); document.querySelectorAll("#cut-prev .pc").forEach(g => g.classList.toggle("hl", gs.includes(g.dataset.pc))); });
$("tiles").addEventListener("pointerleave", () => $("prev").classList.remove("dim"));
document.querySelectorAll(".lvl").forEach(b => b.onclick = () => { cutLv = +b.dataset.lv; document.querySelectorAll(".lvl").forEach(x => x.setAttribute("aria-pressed", x === b)); drawCut(); });
document.querySelectorAll(".chip").forEach(b => b.onclick = () => { const c = b.dataset.cat; cutCats.has(c) ? cutCats.delete(c) : cutCats.add(c); b.setAttribute("aria-pressed", cutCats.has(c)); drawCut(); });
$("run-cut").onclick = () => {
  const prev = $("prev"), btn = $("run-cut");
  cutDone = false; drawCut(); btn.disabled = true;
  prev.classList.remove("busy"); void prev.offsetWidth; prev.classList.add("busy");
  setTimeout(() => { prev.classList.remove("busy"); cutDone = true; btn.disabled = false; drawCut(); }, 900);
};
$("use-cut").onclick = () => { closeDlg($("dlg-cut")); toast(t("used")(Object.keys(cutGroups()).length)); };
$("file-in").onchange = e => {
  const fs = [...e.target.files]; $("thumbs").innerHTML = "";
  fs.slice(0, 10).forEach(f => { if (f.type.startsWith("image/")) { const im = document.createElement("img"); im.alt = f.name; im.src = URL.createObjectURL(f); $("thumbs").appendChild(im); } });
  if (fs.length) toast(t("files")(fs.length));
};

function chosenFmts() { return [...document.querySelectorAll(".fmt")].filter(b => b.getAttribute("aria-pressed") === "true").map(b => b.dataset.fmt); }
function refreshRender() { const n = chosenFmts().length; $("render").textContent = t("render")(n); $("render").disabled = !n; }
document.querySelectorAll(".fmt").forEach(b => b.onclick = () => { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); refreshRender(); });
document.querySelectorAll(".sw").forEach(b => b.onclick = () => document.querySelectorAll(".sw").forEach(x => x.setAttribute("aria-pressed", x === b)));
$("ex-asp").onchange = e => { setAspect(e.target.value); drawOverlay(); };
$("render").onclick = () => {
  const list = chosenFmts(), q = $("queue");
  q.hidden = false;
  q.innerHTML = list.map(f => `<div class="q" data-q="${f}"><b>${f}</b><div class="bar"><i></i></div><span class="st">${t("q_wait")}</span></div>`).join("");
  $("render").disabled = true; let i = 0;
  (function next() {
    if (i >= list.length) { refreshRender(); return; }
    const row = q.querySelector(`[data-q="${list[i]}"]`), bar = row.querySelector("i"), st = row.querySelector(".st");
    st.textContent = `${t("q_run")} · ${$("ex-res").value}`; let p = 0;
    const iv = setInterval(() => { p += 4; bar.style.width = p + "%"; if (p >= 100) { clearInterval(iv); row.classList.add("done"); st.textContent = t("q_done"); i++; next(); } }, 28);
  })();
};

function isDark() { const a = document.documentElement.dataset.theme; return a ? a === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function themeIcon() { $("theme").querySelector("svg").innerHTML = isDark() ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>' : '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>'; }
try { const th = localStorage.getItem("tstm-theme"); if (th === "dark" || th === "light") document.documentElement.dataset.theme = th; } catch (e) {}
$("theme").onclick = () => { const n = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = n; try { localStorage.setItem("tstm-theme", n); } catch (e) {} themeIcon(); };

function setLang(l) {
  lang = l; try { localStorage.setItem("tstm-lang", l); } catch (e) {}
  document.documentElement.lang = l;
  $("lang-th").setAttribute("aria-pressed", l === "th"); $("lang-en").setAttribute("aria-pressed", l === "en");
  document.querySelectorAll("[data-i]").forEach(el => { const v = T[l][el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll("[data-ih]").forEach(el => el.innerHTML = T[l][el.dataset.ih]);
  $("hint").textContent = t("h_" + tool);
  refreshRender(); render(true); drawCut();
}
$("lang-th").onclick = () => setLang("th");
$("lang-en").onclick = () => setLang("en");

setAspect("916"); setBg("alpha"); computeWorld(); applyPose();
IDS.forEach(id => THUMBS[id] = thumbSvg([id], 4));
themeIcon(); setLang(lang);
</script>
